[platformio]
default_envs = pico_w
src_dir = .
include_dir = src

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#aa70b802be8851668053d4f09734e4089fe41932
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
upload_protocol = picotool
build_src_filter = +<src/*.cpp> +<examples/BasicDemo/*.cpp>
build_flags = -Isrc
lib_deps = adafruit/Adafruit GFX Library @ 1.13.0

[env:pico_w]
board = rpipicow

[env:pico]
board = pico
